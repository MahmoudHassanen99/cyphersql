[package]
name = "cyphersql"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }
clickgraph-embedded = { path = "vendor/clickgraph/clickgraph-embedded", default-features = false }
tempfile = "3.8"
